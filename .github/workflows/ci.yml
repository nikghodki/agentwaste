name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: CLI smoke test
        run: agentwaste --demo --card card.html && test -s card.html

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Astro 7.4 needs Node >= 22.23.4; the runner's cached 22.x lagged behind.
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - name: Build docs
        working-directory: docs
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log || {
            # Logs need repo admin rights to read; annotations are public.
            msg=$(tail -c 1500 build.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=docs build failed::${msg:-no output}"
            exit 1
          }
