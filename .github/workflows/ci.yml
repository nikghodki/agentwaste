name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: CLI smoke test
        run: agentwaste --demo --card card.html && test -s card.html

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - name: Build docs
        working-directory: docs
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log || {
            # Logs need repo admin rights to read; annotations are public.
            echo "::error title=docs build failed::$(grep -iE 'error|cannot|failed' build.log | tail -c 1500 | tr '\n' ' ')"
            exit 1
          }
