name: Release to PyPI

# Publishes when a version tag (v0.1.0, ...) is pushed. Uses PyPI trusted
# publishing, so no token is stored anywhere. One-time setup on PyPI:
# https://pypi.org/manage/account/publishing/ -> add a pending publisher with
# project agentwaste, owner nikghodki, repository agentwaste, workflow
# release.yml, environment pypi.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Tag matches package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME != version $version"; exit 1; }
      - run: pip install -e ".[dev]" && pytest -q
      - run: pip install build twine && python -m build && twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
