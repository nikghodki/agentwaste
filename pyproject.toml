[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentwaste"
version = "0.1.0"
description = "Find where your AI coding agent wastes tokens, and how to stop it"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{ name = "nikghodki", email = "nikghodki@gmail.com" }]
dependencies = []
keywords = ["claude-code", "ai-agents", "llm", "tokens", "prompt-caching", "cost", "developer-tools", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/nikghodki/agentwaste"
Documentation = "https://nikghodki.github.io/agentwaste/"
Issues = "https://github.com/nikghodki/agentwaste/issues"
Changelog = "https://github.com/nikghodki/agentwaste/blob/main/CHANGELOG.md"

[project.scripts]
agentwaste = "agentwaste.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.sdist]
# Anchored with "/": unanchored patterns also match legacy/agentsight/src.
# Docs pages and sidebar are kept because tests/test_docs.py reads them.
include = ["/src", "/tests", "/README.md", "/LICENSE", "/CHANGELOG.md", "/pyproject.toml",
           "/docs/sidebar.json", "/docs/src/content"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentwaste"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
